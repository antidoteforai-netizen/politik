  stats:[["194 M€",{etat:"d'aides à la presse en 2023",falc:"d'aides à la presse"},"V"],["809",{etat:"titres aidés en 2023",falc:"journaux aidés"},"V"],["6",{etat:"familles de détention cartographiées, plus le service public",falc:"familles de propriétaires"},"S"]],src:"ministère de la Culture, data.gouv.fr ; sources citées sur la page",btn:{etat:"Ouvrir les médias",falc:"Voir les médias"}},
 {id:"oct17",href:"17-octobre-2026.html",t:{etat:"Le 17 octobre 2026",falc:"Le 17 octobre 2026"},q:{etat:"Que savons-nous des violences, des dégâts et des aides&nbsp;?",falc:"Que s'est-il passé&nbsp;?"},

 [{etat:"Citoyen·ne",falc:"Citoyen·ne"},{etat:"Savoir qui gouverne",falc:"Savoir qui gouverne"},"gouvernement.html"],
 [{etat:"Journaliste",falc:"Journaliste"},{etat:"Retrouver une source",falc:"Trouver une source"},"donnees.html"],
 [{etat:"Décideur",falc:"Décideur"},{etat:"Comparer les indicateurs",falc:"Voir les chiffres du pays"},"secteurs.html"],
 [{etat:"Commerçant·e",falc:"Commerçant·e"},{etat:"Aides après le 17 octobre",falc:"Les aides"},"17-octobre-2026.html#commercants"],
 [{etat:"Salarié·e, freelance, agent de caisse",falc:"Salarié·e, freelance"},{etat:"Comprendre la fraude sociale",falc:"La fraude sociale"},"index.html"],
 [{etat:"Immigrant·e, élu·e, ministre",falc:"Ministre, élu·e"},{etat:"Ministères et ministres",falc:"Les ministères"},"gouvernement.html"]
];
const METHODE=[
 ["V",{etat:"Publié par l'institution elle-même.",falc:"Publié par l'institution."}],
 ["S",{etat:"Source secondaire : presse, étude, association.",falc:"Presse, étude ou association."}],
 ["D",{etat:"Déclaration ou annonce : pas un fait établi.",falc:"Une parole, pas une preuve."}],
 ["A",{etat:"Chiffre cité sans source retrouvée.",falc:"Chiffre sans source."}]
];
const dateCourte=d=>{const m=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],p=d.split("-");return (+p[2])+" "+m[+p[1]-1];};
const dateLong=d=>{const m=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],p=d.split("-");return (+p[2]===1?"1er":+p[2])+" "+m[+p[1]-1]+" "+p[0];};
function filtrerMin(){
  const q=($("#min-q").value||"").trim().toLowerCase(); let n=0, tot=0;
  document.querySelectorAll(".min-tile").forEach(a=>{ tot++; const ok=!q||a.textContent.toLowerCase().includes(q)||(a.dataset.mots||"").includes(q); a.hidden=!ok; if(ok) n++; });
  document.querySelectorAll("#min-groupes .groupe").forEach(h=>{ const g=h.nextElementSibling; h.hidden=g.querySelectorAll(".min-tile:not([hidden])").length===0; g.hidden=h.hidden; });
  $("#min-n").textContent=q?(n?`${n} sur ${tot}`:(L==="falc"?"Aucun résultat":"Aucun ministère trouvé")):"";
  let v=$("#min-vide"); if(q&&!n){ if(!v){ v=document.createElement("p"); v.id="min-vide"; v.className="min-vide"; $("#min-groupes").appendChild(v); } v.textContent=L==="falc"?"Aucun ministère ne correspond.":"Aucun ministère ne correspond à cette recherche."; } else if(v) v.remove();
}
function render(){
  document.body.classList.toggle("falc", L==="falc");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML=pick(TXT[el.dataset.t]); });
  $("#switch").innerHTML=PAGE_LEVELS.map(k=>`<button type="button" aria-pressed="${k===L}" data-level="${k}">${LEVEL_NAMES[k]}</button>`).join("");
  const G=window.GOUV||{ministeres:[],autres_acteurs:[],actualites:[]};
  const FAM={regalien:["Pouvoirs régaliens","var(--c1)"],economie:["Économie et travail","var(--c2)"],territoires:["Territoires et transitions","var(--c3)"],societe:["Société","var(--c4)"],autres:["Autres acteurs","var(--c5)"]};
  const tous=G.ministeres.concat(G.autres_acteurs); const releves=tous.filter(m=>m.verifie_le).length;
  $("#chips").innerHTML=[[G.ministeres.length,L==="falc"?"ministères":"ministères"],[releves+" / "+tous.length,L==="falc"?"relus sur leur site":"relus sur leur site officiel"],[G.actualites.length,L==="falc"?"nouvelles vérifiées":"actualités vérifiées"]].map(c=>`<li><b>${c[0]}</b><span>${c[1]}</span></li>`).join("");
  $("#mosaique").innerHTML=G.ministeres.slice(0,20).map(m=>`<a href="ministere-${esc(m.id)}.html" style="--f:${FAM[m.famille][1]}" title="${esc(m.court)}" aria-label="${esc(m.court)}"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">${m.icone}</svg><span class="lib" aria-hidden="true">${esc(m.court)}</span></a>`).join("");
  $("#min-groupes").innerHTML=["regalien","economie","territoires","societe","autres"].map(f=>{const L2=tous.filter(m=>m.famille===f); if(!L2.length) return ""; return `<h3 class="groupe" style="--f:${FAM[f][1]}"><i></i>${FAM[f][0]}</h3><div class="min-grid">${L2.map(m=>`<a class="min-tile" href="ministere-${esc(m.id)}.html" style="--f:${FAM[f][1]}" data-mots="${esc((m.nom||"").toLowerCase())}"><span class="pic"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">${m.icone}</svg></span><b>${esc(m.court)}</b><span class="who">${esc(m.ministre||"")}</span><span class="st ${m.verifie_le?"ok":""}">${m.verifie_le?(L==="falc"?"Relu":"Relu le "+esc(dateCourte(m.verifie_le))):(L==="falc"?"À relire":"À relire")}</span></a>`).join("")}</div>`;}).join("");
  const R=(window.REGISTRE&&window.REGISTRE.entrees)||[]; const od=new Set(R.filter(e=>(e.type==="jeu"||e.type==="api")&&/data\.gouv\.fr/.test((e.url||"")+" "+(e.producteur||""))).map(e=>e.titre)).size;
  $("#od-txt").innerHTML=L==="falc"?`<b>Open data</b> : ${od?od+" jeux de données":"des jeux de données"} de data.gouv.fr`:`<b>Open data</b> : ${od?od+" jeux de données et API":"des jeux de données"} de data.gouv.fr utilisés sur ce site`;
  const q=$("#min-q"); q.placeholder=pick(TXT["min.ph"]); filtrerMin();
  const porte=(p,i,tot,dossier)=>`<article class="porte${dossier?" dossier":""}" id="${p.id}"><p class="porte-n">${dossier?(L==="falc"?"Dossier":"Dossier"):(i+1)+" / "+tot}</p><h3>${pick(p.t)}</h3><p class="porte-q">${pick(p.q)}</p><ul class="porte-stats">${p.stats.map(s=>`<li><span class="num">${s[0]}</span><span class="lab">${pick(s[1])} ${lvl(s[2])}</span></li>`).join("")}</ul><a class="porte-btn" href="${p.href}">${pick(p.btn)} <span aria-hidden="true">→</span></a><p class="src">${esc(p.src)}</p></article>`;
  $("#portes").innerHTML=ETATS.map((p,i)=>porte(p,i,ETATS.length,false)).join("");
  $("#dossiers-grid").innerHTML=DOSSIERS.map((p,i)=>porte(p,i,DOSSIERS.length,true)).join("");
  const acts=G.actualites.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
  $("#actu").innerHTML=acts.length?acts.map(a=>`<li><time datetime="${a.date}">${dateLong(a.date)}</time><span><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titre)}</a><span class="by">${esc(a.source)} ${lvl(a.niveau||"V")}</span></span></li>`).join(""):`<li>Aucune actualité vérifiée pour le moment.</li>`;
  $("#roles").innerHTML=ROLES.map(r=>`<a class="role" href="${r[2]}"><b>${pick(r[0])}</b><span>${pick(r[1])} <span aria-hidden="true">→</span></span></a>`).join("");
  $("#methode").innerHTML=METHODE.map(m=>`<li>${lvl(m[0])} <span>${pick(m[1])}</span></li>`).join("");
}
$("#min-q").addEventListener("input",filtrerMin);
$("#switch").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-accueil",L);}catch(err){} render(); });
render();
</script>
