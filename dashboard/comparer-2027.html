<script>
const PAGE_LEVELS = ["etat","falc"];
const LEVEL_NAMES = {etat:"Termes de l'État", falc:"Facile À Lire et à Comprendre (FALC)"};
let L = PAGE_LEVELS[0];
try{ const s = localStorage.getItem("politik-level-comparer"); if(PAGE_LEVELS.includes(s)) L = s; }catch(e){}
const pick = o => (o==null?"":(typeof o!=="object"?o:(o[L] ?? o.etat ?? "")));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const POS = (window.POS2027||{}).positions||{};

/* Ordre alphabétique du nom complet, comme sur la page Présidentielle, jamais par sondage. */
const CANDS = [
 {id:"attal",nom:"Gabriel Attal",court:"Attal",parti:"Renaissance"},
 {id:"glucksmann",nom:"Raphaël Glucksmann",court:"Glucksmann",parti:"Place publique"},
 {id:"lepen",nom:"Marine Le Pen",court:"Le Pen",parti:"Rassemblement national"},
 {id:"lisnard",nom:"David Lisnard",court:"Lisnard",parti:"Nouvelle Énergie"},
 {id:"melenchon",nom:"Jean-Luc Mélenchon",court:"Mélenchon",parti:"La France insoumise"},
 {id:"philippe",nom:"Édouard Philippe",court:"Philippe",parti:"Horizons"},
 {id:"retailleau",nom:"Bruno Retailleau",court:"Retailleau",parti:"Les Républicains"},
 {id:"roussel",nom:"Fabien Roussel",court:"Roussel",parti:"Parti communiste français"},
 {id:"tondelier",nom:"Marine Tondelier",court:"Tondelier",parti:"Les Écologistes"},
 {id:"zemmour",nom:"Éric Zemmour",court:"Zemmour",parti:"Reconquête"}
];
CANDS.sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
const SUJETS = [
 {etat:"Fraude sociale",falc:"La fraude aux aides"},
 {etat:"Prestations et non-recours",falc:"Les aides sociales"},
 {etat:"Immigration et asile",falc:"L'immigration"},
 {etat:"Fiscalité des hauts patrimoines",falc:"Les impôts des plus riches"}
];
const NIV = {V:{etat:"Document officiel",falc:"Texte officiel"},S:{etat:"Résumé d'un tiers (Fondation iFRAP)",falc:"Résumé d'un autre site"}};

const TXT = {
  eyebrow:{etat:"Présidentielle 2027 · comparateur", falc:"Présidentielle 2027 · comparer"},
  h1:{etat:"Comparer deux candidats, sujet par sujet.", falc:"Comparer deux candidats."},
  lede:{etat:"Choisissez deux candidats : Politik affiche côte à côte ce que chacun a écrit sur quatre sujets, avec le lien et la date. Pas de score, pas de classement, pas de quiz : seulement des phrases copiées d'un document.", falc:"Choisissez 2 candidats.<br>Vous voyez ce que chacun a écrit sur 4 sujets.<br>Chaque phrase a un lien.<br>Il n'y a pas de note."},
  "falc.badge":{etat:"Texte aussi disponible en Facile À Lire et à Comprendre (FALC)", falc:"Ce texte est en FALC"},
  "s.choix.h":{etat:"Choisissez deux candidats", falc:"Choisissez 2 candidats"},
  "s.choix.p":{etat:"Les candidats sont rangés par ordre alphabétique. Cliquez sur un nom pour le placer en A, puis en B. Le choix se garde dans l'adresse de la page : vous pouvez la partager.", falc:"Cliquez sur un nom.<br>Le premier va en A, le deuxième en B."},
  "pick.aria":{etat:"Candidats disponibles", falc:"Les candidats"},
  "s.res.h":{etat:"Ce que chacun écrit", falc:"Ce que chacun écrit"},
  "s.res.p":{etat:"Quatre sujets que Politik documente. Chaque encadré est une phrase copiée d'un document, jamais reformulée.", falc:"4 sujets. Chaque phrase est copiée."},
  "filtre.officiel":{etat:"Documents officiels seulement (masquer les résumés de tiers)", falc:"Seulement les textes officiels"},
  "s.cov.h":{etat:"Vue d'ensemble : qui est documenté", falc:"Qui a des phrases"},
  "s.cov.p":{etat:"Pour chaque candidat et chaque sujet : un document officiel lu, un résumé de tiers seulement, ou rien pour l'instant. Cliquez sur un nom pour le choisir.", falc:"Un rond plein : texte officiel. Un demi-rond : résumé. Un rond vide : rien."},
  "cov.legende":{etat:"● document officiel lu · ◐ résumé de tiers seulement · ○ rien de relevé · – « proposition non encore connue » selon la Fondation iFRAP. Un rond vide veut dire que Politik n'a rien trouvé, pas que le candidat n'a rien dit.", falc:"● texte officiel · ◐ résumé · ○ rien trouvé"},
  "s.open.h":{etat:"Données ouvertes", falc:"Les données"},
  "s.open.p":{etat:"Toutes les phrases affichées ici sont dans un fichier public : vous pouvez les vérifier, les réutiliser ou les corriger.", falc:"Les phrases sont dans un fichier public."},
  "open.txt":{etat:"Le fichier donne, pour chaque candidat et chaque sujet, la phrase copiée, le lien, la source, la date de lecture et le niveau de confiance (V : document du candidat ou de son parti, S : résumé établi par un tiers).", falc:"Le fichier donne la phrase, le lien et la date."},
  "open.lien":{etat:"Télécharger positions-2027.json", falc:"Télécharger le fichier"},
  "open.signaler":{etat:"Un document officiel manque, une phrase est mal copiée ? Signalez-le avec le lien du document.", falc:"Il manque un texte ? Dites-le avec le lien."},
  "open.issue":{etat:"Signaler un texte manquant ou une erreur (GitHub)", falc:"Dire qu'il manque un texte"},
  "s.meth.h":{etat:"Méthode", falc:"Comment on fait"},
  "s.meth.p":{etat:"Ce que Politik fait, et ce qu'il refuse de faire.", falc:"Ce qu'on fait. Ce qu'on ne fait pas."},
  retour:{etat:"← Retour à la page Présidentielle 2027", falc:"← Retour à la présidentielle"},
  footer:{etat:"Politik · phrases copiées de documents, liens et dates visibles, niveaux de confiance V et S.", falc:"Politik · phrases copiées, avec le lien."},
  "slot.vide":{etat:"Choisir un candidat", falc:"Choisir"},
  "slot.retirer":{etat:"Retirer", falc:"Retirer"},
  "act.swap":{etat:"Inverser A et B", falc:"Inverser"},
  "act.clear":{etat:"Tout effacer", falc:"Effacer"}
};
const REGLES = {
 etat:["Une case = une phrase copiée mot pour mot d'un document, avec son lien et la date de lecture. Politik n'écrit ni synthèse ni déduction.","Niveau V : le document vient du candidat ou de son parti (site de campagne, programme, brochure). Niveau S : un tiers, ici la Fondation iFRAP (think tank), a résumé la position ; ce résumé est à confirmer sur le document du candidat.","Aucun score de proximité, aucune note, aucun classement : deux positions affichées côte à côte ne sont pas comparées par Politik.","Un rond vide veut dire « rien trouvé par Politik », pas « le candidat n'a rien dit ». Les programmes de plusieurs candidats ne sont pas encore publiés.","Les candidats sont rangés par ordre alphabétique, jamais selon les sondages.","Des documents plus anciens (par exemple les « 22 mesures » du Rassemblement national, publiées pour 2022) ne sont pas utilisés comme positions pour 2027."],
 falc:["Chaque case est une phrase copiée.","Chaque phrase a un lien et une date.","On ne donne pas de note.","Un rond vide veut dire : on n'a rien trouvé."]
};

let A=null, B=null, officielSeul=false;
function entriesOf(id,s){ return ((POS[id]||{})[String(s)]||[]); }
function reel(l){ return l.filter(e=>!e.absent); }
function etatCell(id,s){ const l=entriesOf(id,s); const r=reel(l); if(r.some(e=>e.n==="V")) return "V"; if(r.length) return "S"; if(l.length) return "absent"; return "rien"; }

function entryHtml(e){
  const niv=NIV[e.n]; 
  return `<blockquote class="q"><p>« ${esc(e.t)} »</p><footer><span class="lvl lvl-${esc(e.n)}">${esc(e.n)}</span><span>${esc(pick(niv))}</span> · <a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.s)}</a> · <span>${esc(e.d)}</span></footer></blockquote>`;
}
function colHtml(c,cls,s){
  if(!c) return `<div class="col ${cls}"><p class="who">${cls==="a"?"A":"B"}</p><p class="vide">${L==="falc"?"Choisissez un candidat.":"Choisissez un candidat plus haut."}</p></div>`;
  const l=entriesOf(c.id,s); let r=reel(l); if(officielSeul) r=r.filter(e=>e.n==="V");
  let inner;
  if(r.length) inner=r.map(entryHtml).join("");
  else if(l.length && l[0].absent && !officielSeul) inner=`<p class="vide">${L==="falc"?"Proposition pas encore connue.":"Proposition non encore connue"} · <a href="${esc(l[0].u)}" target="_blank" rel="noopener">${esc(l[0].s)}</a>, ${esc(l[0].d)}</p>`;
  else inner=`<p class="vide">${officielSeul&&reel(l).length?(L==="falc"?"Pas de texte officiel lu. Il y a un résumé.":"Aucun document officiel lu pour l'instant. Un résumé de tiers existe : décochez le filtre pour le voir."):(L==="falc"?"Rien trouvé pour l'instant.":"Pas encore de position relevée. Politik n'a rien trouvé de sourcé sur ce sujet.")}</p>`;
  return `<div class="col ${cls}"><p class="who">${cls==="a"?"A":"B"} · ${esc(c.nom)} · ${esc(c.parti)}</p>${inner}</div>`;
}
const find=id=>CANDS.find(c=>c.id===id)||null;
function syncHash(){ const p=[]; if(A) p.push("a="+A.id); if(B) p.push("b="+B.id); try{ history.replaceState(null,"",p.length?"#"+p.join("&"):location.pathname+location.search); }catch(e){} }
function readHash(){ const m=Object.fromEntries(location.hash.replace(/^#/,"").split("&").filter(x=>x.includes("=")).map(x=>x.split("="))); A=find(m.a); B=find(m.b); }
function choose(id){
  const c=find(id); if(!c) return;
  if(A&&A.id===id){ A=null; } else if(B&&B.id===id){ B=null; }
  else if(!A) A=c; else if(!B) B=c; else B=c;
  syncHash(); render();
}
function render(){
  document.body.classList.toggle("falc", L==="falc");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML=pick(TXT[el.dataset.t]); });
  document.querySelectorAll("[data-aria]").forEach(el=>el.setAttribute("aria-label",pick(TXT[el.dataset.aria])));
  $("#switch").innerHTML = PAGE_LEVELS.map(k=>`<button type="button" aria-pressed="${k===L}" data-level="${k}">${LEVEL_NAMES[k]}</button>`).join("");
  const slot=(c,cls)=>`<div class="slot ${cls}${c?" on":""}"><span class="lab">${cls==="a"?"Candidat A":"Candidat B"}</span>${c?`<span class="nm">${esc(c.nom)}</span><span class="pt">${esc(c.parti)}</span><button type="button" class="act" data-retire="${cls}">${esc(pick(TXT["slot.retirer"]))} ${esc(c.court)}</button>`:`<span class="pt">${esc(pick(TXT["slot.vide"]))}</span>`}</div>`;
  $("#slots").innerHTML = slot(A,"a")+`<span class="vs" aria-hidden="true">VS</span>`+slot(B,"b")+`<div style="grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="act" id="swap" ${A&&B?"":"disabled"}>${esc(pick(TXT["act.swap"]))}</button><button type="button" class="act" id="clear" ${A||B?"":"disabled"}>${esc(pick(TXT["act.clear"]))}</button></div>`;
  $("#pick").innerHTML = CANDS.map(c=>{ const cls=(A&&A.id===c.id)?"a":(B&&B.id===c.id)?"b":""; return `<button type="button" class="pk ${cls}" data-id="${c.id}" aria-pressed="${!!cls}"><span class="ini" aria-hidden="true">${esc(c.court.split(" ").map(w=>w[0]).join("").slice(0,2))}</span><span><b>${esc(c.nom)}</b><small>${esc(c.parti)}</small></span></button>`; }).join("");
  $("#sujets").innerHTML = SUJETS.map((s,i)=>`<article class="sj" id="sujet-${i}"><h3>${esc(pick(s))}</h3><div class="duo">${colHtml(A,"a",i)}${colHtml(B,"b",i)}</div></article>`).join("");
  // bilan chiffré sans score : combien de sujets sont documentés pour A et B
  if(A&&B){ let deux=0,un=0,aucun=0; SUJETS.forEach((_,i)=>{ const x=reel(entriesOf(A.id,i)).filter(e=>!officielSeul||e.n==="V").length>0, y=reel(entriesOf(B.id,i)).filter(e=>!officielSeul||e.n==="V").length>0; if(x&&y)deux++; else if(x||y)un++; else aucun++; });
    $("#bilan").textContent = L==="falc" ? `Sur 4 sujets : ${deux} avec une phrase pour les deux, ${un} pour un seul, ${aucun} pour aucun.` : `Sur 4 sujets : ${deux} documenté(s) pour les deux candidats, ${un} pour un seul, ${aucun} pour aucun. Ce n'est pas un score de proximité.`;
  } else $("#bilan").textContent = L==="falc" ? "Choisissez 2 candidats." : "Choisissez deux candidats pour voir leurs positions côte à côte.";
  // matrice de couverture
  const G={V:["●","document officiel lu"],S:["◐","résumé de tiers seulement"],absent:["–","proposition non encore connue"],rien:["○","rien de relevé"]};
  $("#matrice").innerHTML = `<table class="mx"><thead><tr><th>${L==="falc"?"Candidat":"Candidat"}</th>${SUJETS.map(s=>`<th>${esc(pick(s))}</th>`).join("")}</tr></thead><tbody>${CANDS.map(c=>`<tr><td><button type="button" class="nm" data-id="${c.id}">${esc(c.nom)}</button></td>${SUJETS.map((_,i)=>{ const e=etatCell(c.id,i); return `<td class="g" role="img" aria-label="${esc(G[e][1])}" title="${esc(G[e][1])}">${G[e][0]}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  $("#regles").innerHTML = (REGLES[L]||REGLES.etat).map(r=>`<li>${esc(r)}</li>`).join("");
}
document.addEventListener("click",e=>{
  const pk=e.target.closest("[data-id]"); if(pk){ choose(pk.dataset.id); if(pk.classList.contains("nm")) $("#resultat").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  const r=e.target.closest("[data-retire]"); if(r){ if(r.dataset.retire==="a") A=null; else B=null; syncHash(); render(); return; }
  if(e.target.id==="swap"){ [A,B]=[B,A]; syncHash(); render(); }
  if(e.target.id==="clear"){ A=null; B=null; syncHash(); render(); }
});
document.addEventListener("change",e=>{ if(e.target.id==="officiel"){ officielSeul=e.target.checked; render(); } });
window.addEventListener("hashchange",()=>{ readHash(); render(); });
$("#switch").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-comparer", L);}catch(err){} render(); });
readHash(); render();
</script>
