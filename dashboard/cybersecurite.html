const SOURCES=[[SRC_PLAN,"V"],[SRC_COM,"V"],[SRC_ANSSI,"V"],[SRC_EDU,"V"],[SRC_CERT,"V"],[SRC_ANSSIH,"V"],[SRC_KIT,"V"],[SRC_ITC,"S"],[SRC_POD,"S"],[SRC_VT,"D"]];
const dateLong=d=>{const m=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],p=d.split("-");return (+p[2]===1?"1er":+p[2])+" "+m[+p[1]-1]+" "+p[0];};
function card(c){ return `<div class="card"><h3>${pick(c.h)} ${lvl(c.lvl)}</h3><ul class="mini">${c.items.map(i=>`<li>${pick(i)}</li>`).join("")}</ul>${c.link?`<p style="margin-top:10px"><a href="${esc(c.link.u)}" target="_blank" rel="noopener">${pick(c.link.t)}</a></p>`:""}<p class="src">${c.src.map(s=>srcLink(s[0],s[1])).join(" · ")}</p></div>`; }
function render(){
  document.body.classList.toggle("falc", L==="falc");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML=pick(TXT[el.dataset.t]); });
  $("#switch").innerHTML=PAGE_LEVELS.map(k=>`<button type="button" aria-pressed="${k===L}" data-level="${k}">${LEVEL_NAMES[k]}</button>`).join("");
  $("#kpis").innerHTML=KPI.map(k=>`<div class="tile"><span class="kind">${pick(k.kind)}</span><span class="val num">${k.v}<small>${pick(k.u)}</small></span><span class="src">${lvl(k.lvl)} ${esc(k.src)}</span></div>`).join("");
  $("#plan-cards").innerHTML=PLAN.map(card).join("");
  $("#frise").innerHTML=INC.map(f=>`<li><span class="d">${dateLong(f[0])}</span><span>${pick(f[1])}${lvl(f[2])}<span class="by">${srcLink(f[3][0],f[3][1])}</span></span></li>`).join("");
  $("#vauban-cards").innerHTML=VAUBAN.map(card).join("");
  $("#agir-cards").innerHTML=AGIR.map(card).join("");
  $("#manque-list").innerHTML=(MANQUE[L]||MANQUE.etat).map(x=>`<li>${x}</li>`).join("");
  Qcm.draw("#qcm-cyber",QCM,L);
  $("#tbl-src").innerHTML=`<table><thead><tr><th>Source</th><th>${L==="falc"?"Sûr ?":"Niveau"}</th></tr></thead><tbody>${SOURCES.map(s=>`<tr><td><a href="${esc(s[0].u)}" target="_blank" rel="noopener">${esc(s[0].t)}</a></td><td>${lvl(s[1])}</td></tr>`).join("")}</tbody></table>`;
}
$("#switch").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-cyber",L);}catch(err){} render(); });
render();
</script>
