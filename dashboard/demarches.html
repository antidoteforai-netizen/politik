<script>
const PAGE_LEVELS = ["etat","falc"];
const LEVEL_NAMES = {etat:"Termes de l'État", falc:"Facile À Lire et à Comprendre (FALC)"};
let L = PAGE_LEVELS[0];
try{ const s = localStorage.getItem("politik-level-demarches"); if(PAGE_LEVELS.includes(s)) L = s; }catch(e){}
const pick = o => (o==null?"":(typeof o!=="object"?o:(o[L] ?? o.etat ?? "")));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = (window.PRATIQUE||{}).sujets||[];
const MIN = {"ville-logement":"Ville et Logement","travail-solidarites":"Travail et Solidarités","economie":"Économie et Finances","sante":"Santé et Familles"};
let vue = "tout";

const TXT = {
  eyebrow:{etat:"Que faire ? · logement, travail, consommation, famille", falc:"Que faire ?"},
  h1:{etat:"Que faire, et vers qui aller ?", falc:"Que faire ? Qui appeler ?"},
  lede:{etat:"Quatre situations de la vie courante. Pour chacune : ce que dit la source officielle, la démarche à suivre et le bon numéro. Chaque phrase est copiée d'un site de l'État, avec sa date.", falc:"4 situations de la vie.<br>Pour chacune : ce que dit le site de l'État, la démarche, le numéro.<br>Les phrases sont copiées."},
  avert:{etat:"Politik oriente, il ne conseille pas : ce n'est ni un service de l'État ni un avis juridique. En cas de doute, appelez le numéro officiel ou ouvrez le lien de la source.", falc:"Politik montre où aller. Politik ne donne pas de conseil. En cas de doute, appelez le numéro."},
  "falc.badge":{etat:"Texte aussi disponible en Facile À Lire et à Comprendre (FALC)", falc:"Ce texte est en FALC"},
  "s.sit.h":{etat:"Choisissez votre situation", falc:"Choisissez"},
  "s.sit.p":{etat:"Mes droits, les démarches, les numéros utiles : tout est sur la même page. Les liens ouvrent le site officiel.", falc:"Les droits, les démarches, les numéros."},
  "vue.aria":{etat:"Ce que vous voulez voir", falc:"Ce que vous voulez voir"},
  "s.meth.h":{etat:"Méthode", falc:"Comment on fait"},
  "s.meth.p":{etat:"Ce que Politik fait, et ce qu'il refuse de faire.", falc:"Ce qu'on fait. Ce qu'on ne fait pas."},
  "lien.pop":{etat:"Voir les démarches les plus lues sur service-public.gouv.fr →", falc:"Voir les démarches les plus lues →"},
  footer:{etat:"Politik · phrases copiées de sites officiels, liens et dates visibles.", falc:"Politik · phrases copiées, avec le lien."}
};
const REGLES = {
 etat:["Chaque phrase est copiée mot pour mot d'une page officielle (service-public.gouv.fr, ministères, SignalConso, 119). Politik n'y ajoute ni conseil ni interprétation.","La date indiquée est celle de la vérification de la fiche par son éditeur, ou celle de la lecture par Politik quand la page n'en porte pas.","Une règle peut changer : ouvrez toujours le lien avant d'agir.","Ce n'est pas un avis juridique. Pour un avis sur votre cas, appelez le numéro indiqué ou un professionnel.","Les sujets sont limités à quatre pour garder des liens à jour ; d'autres suivront.","Les numéros affichés sont ceux des sites officiels cités, lus à la date indiquée."],
 falc:["Chaque phrase est copiée d'un site de l'État.","La date dit quand la page a été vérifiée.","Une règle peut changer. Ouvrez le lien avant d'agir.","Politik ne donne pas d'avis juridique."]
};
const VUES = [["tout",{etat:"Tout voir",falc:"Tout"}],["droits",{etat:"Mes droits",falc:"Mes droits"}],["demarches",{etat:"Faire une démarche",falc:"Une démarche"}],["numeros",{etat:"Numéros utiles",falc:"Numéros"}]];

const q = e => `<blockquote class="pq"><p>« ${esc(e.t)} »</p><footer><span class="lvl lvl-V">V</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.s)}</a> · <span>${esc(e.d)}</span></footer></blockquote>`;
const dm = e => `<article class="dm"><h5><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.titre)} <span aria-hidden="true">↗</span></a></h5><p>« ${esc(e.t)} »</p><footer><span class="lvl lvl-V">V</span> ${esc(e.s)} · ${esc(e.d)}</footer></article>`;
const nm = e => `<div class="num"><a class="tel" href="tel:${esc(e.tel)}">${esc(e.numero)}</a><p>« ${esc(e.t)} »</p><footer><span class="lvl lvl-V">V</span> <a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.s)}</a> · ${esc(e.d)}</footer></div>`;

function setVueFromHash(){ const h=location.hash.replace("#",""); if(["droits","demarches","numeros"].includes(h)){ vue=h; } }
function render(){
  document.body.classList.toggle("falc", L==="falc");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML=pick(TXT[el.dataset.t]); });
  document.querySelectorAll("[data-aria]").forEach(el=>el.setAttribute("aria-label",pick(TXT[el.dataset.aria])));
  $("#switch").innerHTML = PAGE_LEVELS.map(k=>`<button type="button" aria-pressed="${k===L}" data-level="${k}">${LEVEL_NAMES[k]}</button>`).join("");
  $("#vue").innerHTML = VUES.map(([k,l])=>`<button type="button" data-vue="${k}" aria-pressed="${vue===k}">${esc(pick(l))}</button>`).join("");
  const showD=vue==="tout"||vue==="droits", showM=vue==="tout"||vue==="demarches", showN=vue==="tout"||vue==="numeros";
  const cols=[showD,showM,showN].filter(Boolean).length;
  $("#sujets").innerHTML = P.map(s=>`<section class="pr" id="${esc(s.id)}"><h3>${esc(s.titre)}</h3><p class="ac">${esc(s.accroche)}</p><p class="min small muted">${L==="falc"?"Le ministère :":"Ministère concerné :"} <a href="ministere-${esc(s.ministere)}.html">${esc(MIN[s.ministere]||s.ministere)}</a></p><div class="pcols" style="${cols<3?`grid-template-columns:repeat(${cols},minmax(0,1fr))`:""}">${showD?`<div class="pcol"><h4>${L==="falc"?"Mes droits":"Mes droits"}</h4>${s.droits.map(q).join("")}</div>`:""}${showM?`<div class="pcol"><h4>${L==="falc"?"Les démarches":"Faire une démarche"}</h4>${s.demarches.map(dm).join("")}</div>`:""}${showN?`<div class="pcol"><h4>${L==="falc"?"Qui appeler":"Numéros utiles"}</h4>${(s.numeros||[]).length?s.numeros.map(nm).join(""):`<p class="nonum">${L==="falc"?"Pas de numéro dans les sources lues.":"Pas de numéro dans les sources lues : suivez les liens de démarche."}</p>`}</div>`:""}</div></section>`).join("");
  $("#regles").innerHTML = (REGLES[L]||REGLES.etat).map(r=>`<li>${esc(r)}</li>`).join("");
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-vue]"); if(!b) return; vue=b.dataset.vue; render(); });
window.addEventListener("hashchange",()=>{ setVueFromHash(); render(); });
$("#switch").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-demarches", L);}catch(err){} render(); });
setVueFromHash(); render();
if(location.hash && document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
</script>
