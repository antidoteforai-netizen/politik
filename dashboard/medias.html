const TXT={
  eyebrow:{etat:"Propriété des médias · six familles et le service public", falc:"Qui possède les journaux, les radios et les télés ?"},
  h1:{etat:"Quel média appartient à qui ?", falc:"Qui possède les médias ?"},
  lede:{etat:"Six familles industrielles et financières figurent parmi les principaux propriétaires de la presse et de l'audiovisuel privés nationaux (la carte ne prétend pas à l'exhaustivité), et l'État tient deux leviers : il nomme le régulateur qui attribue les fréquences, et il verse chaque année les aides à la presse. Cette page montre les chaînes de détention, les liens avec l'État, les aides publiques reçues titre par titre, puis un focus sur le groupe Bolloré. Chaque fait porte son niveau de confiance.", falc:"Six familles très riches possèdent beaucoup de grandes télés, radios et journaux privés.<br>L'État donne de l'argent aux journaux.<br>L'État choisit aussi qui a le droit d'avoir une chaîne de télé.<br>Cette page montre qui possède quoi, et combien l'État donne.<br>Chaque chiffre dit d'où il vient."},

  "s.carte.p":{etat:"Chaîne de détention de la personne au média, d'après les sources citées sous chaque carte. Le pourcentage n'est affiché que lorsqu'une source le donne. « Secteur d'origine » dit de quoi vit le groupe en dehors des médias : c'est là que passe la dépendance à l'État.", falc:"Pour chaque famille : la personne, ses sociétés, puis ses médias.<br>On dit aussi de quoi vit la famille en dehors des médias."},
  "s.liens.h":{etat:"Les liens avec l'État : quatre types de connexions", falc:"Les liens avec l'État"},
  "s.liens.p":{etat:"Quatre types de liens relient les propriétaires à l'État. La flèche va de celui qui agit ou verse vers celui qui reçoit ou subit ; une double flèche indique une relation réciproque. Trait plein : lien établi par une source officielle ou recoupée (niveaux V et S). Trait pointillé : lien rapporté par la presse (D) ou non chiffré (A), non établi par cette page. Aucune appréciation de ligne éditoriale n'est présentée comme un fait.", falc:"Il y a quatre sortes de liens entre les propriétaires et l'État.<br>La flèche va de celui qui donne ou décide vers celui qui reçoit.<br>Deux flèches : le lien va dans les deux sens.<br>Trait plein : lien sûr.<br>Trait pointillé : lien raconté par les journaux, ou pas chiffré."},

  "aides.evo.h":{etat:"Évolution par famille", falc:"Année après année"},
  "aides.evo.p":{etat:"Même rattachement, en millions d'euros. Deux ruptures de périmètre : 2020 (aides exceptionnelles de crise) et 2023 (l'aide à l'exemplaire posté remplace les tarifs postaux réduits, décret 2023-132 : le total double sans que les journaux reçoivent deux fois plus). Avant 2020, le jeu ne renseigne pas le groupe d'appartenance : seul le nom du titre sert au rattachement, donc les totaux 2015-2019 sont des minimums.", falc:"En millions d'euros.<br>Attention : en 2023, la règle a changé. Le total double, mais les journaux ne reçoivent pas deux fois plus.<br>Avant 2020, on connaît moins bien les groupes : les chiffres sont des minimums."},

  "focus.frise.h":{etat:"Frise 2015-2026", falc:"Les dates importantes"},

  "s.src.h":{etat:"Méthode, limites et sources", falc:"Comment on a fait"},

function schema(){
  const W=800,H=410,lx=215,rx=590,hwO=110,hwE=120; const own=OWNERS.filter(o=>!o.pub);
  const ys=i=>40+i*58, ye=i=>74+i*86, halfH=id=>pos[id][0]===rx?26:16;
  const pos={}; own.forEach((o,i)=>pos[o.id]=[lx,ys(i)]); NODES_ETAT.forEach(([k],i)=>pos[k]=[rx,ye(i)]);
  const hw=id=>pos[id][0]===rx?hwE:hwO;
  /* côté d'attache de chaque lien et décalage vertical pour que les flèches d'un même nœud ne se superposent pas */
  const side=(l,end)=>{ const a=pos[l.de],b=pos[l.vers]; const id=end==="de"?l.de:l.vers, o=end==="de"?l.vers:l.de; const same=a[0]===b[0]; if(same) return pos[id][0]===lx?"L":"R"; return pos[id][0]===lx?"r":"l"; };
  const slots={}; LIENS.forEach((l,k)=>["de","vers"].forEach(e=>{ const key=(e==="de"?l.de:l.vers)+side(l,e); (slots[key]=slots[key]||[]).push(k+e); }));
  const off=(l,k,e)=>{ const key=(e==="de"?l.de:l.vers)+side(l,e), arr=slots[key], n=arr.length, i=arr.indexOf(k+e), gap=pos[e==="de"?l.de:l.vers][0]===rx?11:10; return (i-(n-1)/2)*gap; };
  const defs=Object.entries(TYPES).map(([k,t])=>`<marker id="ah-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${t.c}"/></marker>`).join("");
  const labels=[];
  const edges=LIENS.map((l,k)=>{ const A=pos[l.de],B=pos[l.vers]; if(!A||!B) return ""; const t=TYPES[l.type], dash=(l.lvl==="D"||l.lvl==="A");
    const y0=A[1]+off(l,k,"de"), y1=B[1]+off(l,k,"vers"); let d, lx0, ly0, rot=null;
    if(A[0]===B[0]){ const dir=A[0]===lx?-1:1, x0=A[0]+dir*hw(l.de), x1=B[0]+dir*hw(l.vers), bu=dir*62; d=`M${x0},${y0} C${x0+bu},${y0} ${x1+bu},${y1} ${x1},${y1}`; lx0=(x0+3*(x0+bu)+3*(x1+bu)+x1)/8+dir*9; ly0=(y0+y1)/2; rot=true; }
    else { const right=A[0]<B[0], x0=right?A[0]+hw(l.de):A[0]-hw(l.de), x1=right?B[0]-hw(l.vers):B[0]+hw(l.vers), cx=(x0+x1)/2; d=`M${x0},${y0} C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
      const ownerEnd=A[0]===lx?"de":"vers"; const ox=ownerEnd==="de"?x0:x1, oy=ownerEnd==="de"?y0:y1; lx0=ox+11; ly0=oy-8; }
    labels.push(rot?`<text class="elab" transform="rotate(-90 ${lx0} ${ly0})" x="${lx0}" y="${ly0}" text-anchor="middle" style="fill:${t.c}">${esc(pick(l.lab))}</text>`:`<text class="elab" x="${lx0}" y="${ly0}" style="fill:${t.c}">${esc(pick(l.lab))}</text>`);
    return `<path d="${d}" fill="none" stroke="${t.c}" stroke-width="2.5"${dash?' stroke-dasharray="6 5"':""} marker-end="url(#ah-${l.type})"${l.bi?` marker-start="url(#ah-${l.type})"`:""}><title>${esc((l.bi?"↔ ":"→ ")+pick(l.t))} (${l.lvl})</title></path>`; }).join("");
  const wrap=(t,n)=>{ const out=[]; let c=""; t.split(" ").forEach(w=>{ if((c+" "+w).trim().length>n&&c){ out.push(c); c=w; } else c=(c+" "+w).trim(); }); if(c) out.push(c); return out; };
  const node=(id,label,etat,x,y)=>{ const h=etat?26:16, w=etat?hwE:hwO, ln=wrap(label,etat?31:26), y0=y+4-(ln.length-1)*7; const slug=etat?ETAT_ENT[id]:OWN_ENT[id], src=window.Ent&&slug&&Ent.img(slug); const av=src?`<clipPath id="cp-${id}"><circle cx="${x-w+22}" cy="${y}" r="13"/></clipPath><circle cx="${x-w+22}" cy="${y}" r="14" fill="#fff" stroke="var(--line)"/><image href="${src}" x="${x-w+9}" y="${y-13}" width="26" height="26" clip-path="url(#cp-${id})" preserveAspectRatio="${etat?"xMidYMid meet":"xMidYMid slice"}"/>`:""; return `<rect class="node${etat?" etat":""}" x="${x-w}" y="${y-h}" width="${2*w}" height="${2*h}" rx="8"/>${av}<text x="${x}" y="${y0}" text-anchor="middle">${ln.map((t,i)=>`<tspan x="${x}" dy="${i?14:0}">${esc(t)}</tspan>`).join("")}</text>`; };
  const nodes=own.map((o,i)=>node(o.id,o.nom,false,lx,ys(i))).join("")+NODES_ETAT.map(([k,n],i)=>node(k,pick(n),true,rx,ye(i))).join("");
  $("#schema").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L==="falc"?"Schéma des liens entre les propriétaires de médias et l'État. Les flèches vont de celui qui donne ou décide vers celui qui reçoit. Le tableau ci-dessous donne la même information en texte.":"Schéma orienté des liens entre les six propriétaires et les quatre leviers de l'État : la flèche va de celui qui agit ou verse vers celui qui reçoit ou subit. Le tableau ci-dessous donne la même information en texte.")}"><defs>${defs}</defs><text x="${lx}" y="16" text-anchor="middle" class="small">${L==="falc"?"Les propriétaires":"Propriétaires"}</text><text x="${rx}" y="16" text-anchor="middle" class="small">${L==="falc"?"L'État":"L'État et ses leviers"}</text>${edges}${nodes}${labels.join("")}</svg>`;
  const sample=(t,bi,dash)=>`<svg width="54" height="14" viewBox="0 0 54 14" aria-hidden="true"><line x1="${bi?9:2}" y1="7" x2="44" y2="7" stroke="${t.c}" stroke-width="2.5"${dash?' stroke-dasharray="5 4"':""}/><path d="M52,7 L43,2.5 L43,11.5z" style="fill:${t.c}"/>${bi?`<path d="M2,7 L11,2.5 L11,11.5z" style="fill:${t.c}"/>`:""}</svg>`;
  const grey={c:"var(--ink-3)"};
  $("#schema-legend").innerHTML=Object.entries(TYPES).map(([k,t])=>`<span>${sample(t,k==="familial",k==="familial"||k==="economique")}${pick(t.n)}</span>`).join("")+`<span>${sample(grey,false,false)}${L==="falc"?"Trait plein : lien sûr":"Trait plein : lien établi (V, S)"}</span><span>${sample(grey,false,true)}${L==="falc"?"Pointillé : raconté ou pas chiffré":"Pointillé : rapporté ou non chiffré (D, A)"}</span>`;
  const name=id=>(OWNERS.find(o=>o.id===id)||{}).nom||pick((NODES_ETAT.find(n=>n[0]===id)||[0,{}])[1]);
  $("#tbl-liens").innerHTML=`<table><thead><tr><th>${L==="falc"?"De":"De"}</th><th aria-label="Sens">Sens</th><th>${L==="falc"?"Vers":"Vers"}</th><th>${L==="falc"?"Quoi":"Lien"}</th><th>${L==="falc"?"Sûr ?":"Niveau"}</th><th>Source</th></tr></thead><tbody>${LIENS.map(l=>`<tr><td>${esc(name(l.de))}</td><td aria-label="${l.bi?"dans les deux sens":"vers"}">${l.bi?"↔":"→"}</td><td>${esc(name(l.vers))}</td><td>${esc(pick(l.t))}</td><td>${lvl(l.lvl)}</td><td class="small muted">${esc(l.src)}</td></tr>`).join("")}</tbody></table>`;
}

    {kind:{etat:"Familles cartographiées",falc:"Familles"}, v:"6", u:{etat:"+ le service public",falc:"et les médias publics"}, lvl:"S", src:"sources citées sous chaque carte"},
    {kind:{etat:`Aides à la presse ${an}`,falc:`Argent donné aux journaux en ${an}`}, v:A?(L==="falc"?String(Math.round(tot/1e6)):(tot/1e6).toLocaleString("fr-FR",{maximumFractionDigits:0})):"n. d.", u:{etat:`M€, ${A?A.par_annee[an].titres:""} titres`,falc:"millions d'euros"}, lvl:"V", src:"Ministère de la Culture, data.gouv.fr"},
    {kind:{etat:"Part reçue par les familles de la carte",falc:"Part pour les six familles"}, v:A?Math.round(part/tot*100)+" %":"n. d.", u:{etat:`soit ${(part/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})} M€`,falc:`soit ${Math.round(part/1e6)} millions`}, lvl:"V", src:"calcul Politik sur le jeu titres aidés"},
    {kind:{etat:"Amendes cumulées de C8",falc:"Amendes de C8"}, v:"7,6", u:{etat:"M€, avant le retrait de fréquence",falc:"millions d'euros"}, lvl:"S", src:"AFP via DH, 12 déc. 2024"}
  ];
  $("#kpis").innerHTML=KPIS.map(k=>`<div class="tile"><span class="kind">${pick(k.kind)}</span><span class="val num">${k.v}<small>${pick(k.u)}</small></span><span class="src">${lvl(k.lvl)} ${esc(k.src)}</span></div>`).join("");
  $("#owners").innerHTML=OWNERS.map(o=>{ const f=A&&o.fam?A.familles_derniere_annee[o.fam]:null; return `<div class="card owner"><div class="head"><span style="display:flex;gap:12px;align-items:center">${window.Ent?Ent.avatar(OWN_ENT[o.id],44,o.nom):""}<h3>${esc(o.nom)}</h3></span><span class="sect">${pick(o.sect)}</span></div><ul class="chain">${o.chain.map(c=>`<li class="${c[1]||""}">${esc(c[0])}</li>`).join("")}</ul><ul class="medias">${o.medias.map(m=>`<li class="${m[1]||""}">${esc(m[0])}</li>`).join("")}</ul><p class="small muted">${pick(o.etat)}</p><div class="aid">${o.fam?`<span>${L==="falc"?"Argent reçu de l'État en "+an:"Aides à la presse "+an+" (titres rattachés)"}</span><b class="num">${f?meur(f.total/1e6):(L==="falc"?"rien trouvé":"aucun titre rattaché")}</b>`:(o.pub?`<span>${L==="falc"?"Financé par l'État":"Financement public, voté en loi de finances"}</span><b>—</b>`:`<span>${L==="falc"?"Pas de journaux : pas d'aides à la presse":"Pas de presse écrite : hors aides à la presse"}</span><b>0</b>`)}</div><p class="src">${o.src.map(s=>`${lvl(s[2])} ${s[1]?`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`:esc(s[0])}`).join(" · ")}</p></div>`; }).join("");
  schema();
  Qcm.draw("#qcm-medias",QCM,L);
  if(A){
    const fams=Object.entries(A.familles_derniere_annee).map(([l,v])=>({l,v:v.total/1e6,alt:FAM6.includes(l)})).sort((a,b)=>b.v-a.v);
    $("#ch-aides").innerHTML=hbar(fams);
    $("#tbl-aides").innerHTML=`<table><thead><tr><th>${L==="falc"?"Famille":"Famille de propriétaires"}</th><th>${L==="falc"?"Journaux":"Titres"}</th><th>${L==="falc"?"Total":"Aides directes"}</th><th>Total</th><th>${L==="falc"?"Les plus aidés":"Principaux titres"}</th></tr></thead><tbody>${fams.map(f=>{const v=A.familles_derniere_annee[f.l];return `<tr><td>${esc(f.l)}</td><td class="num">${v.titres}</td><td class="num">${meur(v.direct/1e6)}</td><td class="num">${meur(v.total/1e6)}</td><td class="small">${v.principaux.map(p=>esc(p.titre)).join(", ")}</td></tr>`}).join("")}</tbody></table>`;
    $("#aides-src").innerHTML=`${lvl("V")} Ministère de la Culture, titres aidés ${an}, total des aides individuelles ; rattachement Politik (${A.calcule_le}). <a href="${esc(A.sources.titres)}" target="_blank" rel="noopener">data.gouv.fr</a>`;
    const yrs=A.annees.filter(y=>+y>=2020);
    $("#tbl-evo").innerHTML=`<table><thead><tr><th>Famille</th>${yrs.map(y=>`<th class="num">${y}</th>`).join("")}</tr></thead><tbody>${A.series.map(s=>`<tr><td>${esc(s.famille)}</td>${s.points.filter(p=>+p.annee>=2020).map(p=>`<td class="num">${p.total_meur.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})}</td>`).join("")}</tr>`).join("")}<tr><td><b>${L==="falc"?"Tous les journaux aidés":"Ensemble des titres aidés"}</b></td>${yrs.map(y=>`<td class="num"><b>${(A.par_annee[y].total/1e6).toLocaleString("fr-FR",{maximumFractionDigits:0})}</b></td>`).join("")}</tr></tbody></table>`;
    $("#evo-src").innerHTML=`${lvl("V")} ${L==="falc"?"En millions d'euros. Ministère de la Culture, data.gouv.fr.":"M€ courants, total des aides individuelles, 2020-"+an+" ; 2015-2019 : minimums, la colonne « groupe » n'est pas renseignée avant 2020."}`;
    const gy=Object.keys(A.groupes_publies).sort().pop(); const g=A.groupes_publies[gy].slice(0,10).map(x=>({l:x.groupe,v:x.total_eur/1e6}));
    $("#ch-grp").innerHTML=hbar(g);
    $("#grp-src").innerHTML=`${lvl("V")} Ministère de la Culture, principaux groupes aidés, ${gy}, total des aides (directes + distribution + modernisation sociale). <a href="${esc(A.sources.groupes)}" target="_blank" rel="noopener">data.gouv.fr</a>`;
  } else {
    ["#ch-aides","#tbl-evo","#ch-grp"].forEach(s=>$(s).innerHTML=`<p class="muted small">${L==="falc"?"Les chiffres ne sont pas disponibles pour le moment.":"Les données sur les aides ne sont pas disponibles pour le moment."}</p>`);
  }
  const fk=[
    {kind:{etat:"Médias du groupe",falc:"Ses médias"}, v:"8", u:{etat:"marques citées sur la carte",falc:"grandes marques"}, lvl:"S", src:"sources citées sous chaque carte"},
    {kind:{etat:"Scission Vivendi",falc:"Vivendi coupé en quatre"}, v:"97,5 %", u:{etat:"des voix, AG du 9 déc. 2024",falc:"des votes pour"}, lvl:"V", src:"Vivendi"},
    {kind:{etat:"Chaînes perdues sur la TNT",falc:"Chaînes perdues"}, v:"1", u:{etat:"C8, le 28 févr. 2025",falc:"C8, en 2025"}, lvl:"S", src:"Public Sénat"},
    {kind:{etat:"Aides à la presse, dernière année",falc:"Argent reçu pour ses journaux"}, v:A?(L==="falc"?String(Math.round((A.familles_derniere_annee["Bolloré (Lagardère, Prisma)"]||{total:0}).total/1e6*10)/10).replace(".",","):((A.familles_derniere_annee["Bolloré (Lagardère, Prisma)"]||{total:0}).total/1e6).toLocaleString("fr-FR",{maximumFractionDigits:2})):"n. d.", u:{etat:"M€, Le JDD seul titre rattaché",falc:"millions d'euros, pour le JDD"}, lvl:"V", src:"data.gouv.fr"}
  ];
  $("#focus-kpis").innerHTML=fk.map(k=>`<div class="tile"><span class="kind">${pick(k.kind)}</span><span class="val num">${k.v}<small>${pick(k.u)}</small></span><span class="src">${lvl(k.lvl)} ${esc(k.src)}</span></div>`).join("");
  $("#frise").innerHTML=FRISE.map(f=>`<li><span class="d">${esc(f[0])}</span><span>${esc(pick(f[1]))}${lvl(f[2])}<br><span class="small muted">${esc(f[3])}</span></span></li>`).join("");
  $("#board").innerHTML=BOARD.map(b=>`<div class="row"><span><b>${esc(pick(b[0]))}</b>${esc(pick(b[1]))}</span>${lvl(b[2])}</div>`).join("");
  $("#focus-aides").innerHTML=FOCUS_ETAT.map(x=>`<div class="row"><span><b>${esc(pick(x.k))}</b>${esc(x.v(A))}<br><span class="small muted">${esc(x.src)}</span></span>${lvl(x.lvl)}</div>`).join("");
  $("#autres-grid").innerHTML=AUTRES.map(a=>`<div class="card alt"><span class="kind">${pick(a.kind)}</span><h3>${esc(a.h)}</h3><p class="small muted">${pick(a.p)}</p><p class="src">${lvl(a.lvl)} <a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.u.replace(/^https?:\/\//,""))}</a></p></div>`).join("");
  $("#regles").innerHTML=(REGLES[L]||REGLES.etat).map(r=>`<li>${esc(r)}</li>`).join("");
  $("#tbl-src").innerHTML=`<table><thead><tr><th>Source</th><th>${L==="falc"?"Sûr ?":"Niveau"}</th></tr></thead><tbody>${SOURCES.map(s=>`<tr><td>${s[1]?`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`:esc(s[0])}</td><td>${lvl(s[2])}</td></tr>`).join("")}</tbody></table>`;
}
$("#switch").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-medias",L);}catch(err){} render(); });
document.addEventListener("mousemove",e=>{ const b=e.target.closest&&e.target.closest("[data-tip]"); if(b) showTip(e,b.dataset.tip); else hideTip(); });
render();
</script>
