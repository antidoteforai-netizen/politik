  $("#kpis").innerHTML=KPIS.map(k=>`<div class="tile"><span class="kind">${pick(k.kind)}</span><span class="val num">${k.v}<small>${pick(k.u)}</small></span><span class="src"><span class="lvl lvl-${k.lvl}">${k.lvl}</span> ${esc(k.src)}</span></div>`).join("");
  const lab={ok:L==="falc"?"déjà fait":"dans Politik", todo:L==="falc"?"à faire":"pas encore traité", warn:L==="falc"?"en partie":"partiel"};
  $("#familles-grid").innerHTML=FAMILLES.map((f,i)=>{ const ok=f.sujets.filter(s=>s[1]==="ok").length; return `<div class="card fam"><div class="head"><h3>${pick(f.n)}</h3><span class="kpi">${ok}<small>/ ${f.sujets.length} ${L==="falc"?"faits":"traités"}</small></span></div><p class="small muted">${pick(f.d)}</p><ul>${f.sujets.map(s=>`<li>${s[2]?`<a href="${esc(s[2])}">${esc(s[0])}</a>`:esc(s[0])}<span class="pill ${s[1]}">${lab[s[1]]}</span><br><span class="small muted">${L==="falc"?"Chiffres : ":"Source : "}${esc(s[3])}</span></li>`).join("")}</ul></div>`; }).join("");
  $("#sujets-list").innerHTML=SUJETS.map((s,i)=>`<div class="rank"><div class="n">${i+1}</div><div><b>${pick(s.t)}</b><div class="why">${pick(s.why)}</div><div class="small muted" style="margin-top:4px">${L==="falc"?"Chiffres : ":"Source : "}${esc(s.src)}</div></div></div>`).join("");
  $("#regles").innerHTML=(REGLES[L]||REGLES.etat).map(r=>`<li>${esc(r)}</li>`).join("");
}
$("#switch").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; L=b.dataset.level; try{ localStorage.setItem("politik-level-secteurs",L);}catch(err){} render(); });
render();
